<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Карточка сотрудника</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf3;--card:#fff;--ink:#14213d;--muted:#5b6678;--accent:#1d4ed8;--accent-ink:#fff;--line:#d5dce6}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#17202f;--ink:#eef2f8;--muted:#9aa6ba;--accent:#5b8cff;--accent-ink:#0e1522;--line:#27334a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
main{width:100%;max-width:420px}
.card{background:var(--card);border-radius:28px;padding:32px 24px 24px;text-align:center;box-shadow:0 1px 0 var(--line)}
.photo{width:128px;height:128px;border-radius:50%;object-fit:cover;margin:0 auto 20px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-size:44px;font-weight:800;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
h1{margin:0 0 6px;font-size:26px;line-height:1.2;font-weight:800}
.role{margin:0 0 18px;color:var(--accent);font-weight:600}
.bio{margin:0 0 28px;color:var(--muted);line-height:1.6;white-space:pre-line}
.links{display:grid;gap:10px}
.links a{display:block;padding:15px 18px;border-radius:16px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.links a:first-child{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.links a:hover{border-color:var(--accent)}
.links a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<main id="app"><p class="msg">Загрузка…</p></main>
<script>
(function(){
  var app=document.getElementById('app');
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
  function id(){var h=decodeURIComponent(location.hash.replace('#','')).trim();
    return h||new URLSearchParams(location.search).get('id')||''}
  function render(list){
    var e=list.find(function(x){return x.id===id()});
    if(!e){app.innerHTML='<p class="msg">Карточка не найдена. Проверьте ссылку.</p>';return}
    document.title=e.name+' — '+e.role;
    var initials=e.name.split(' ').map(function(w){return w[0]}).slice(0,2).join('');
    var photo=e.photo?'<div class="photo"><img src="'+esc(e.photo)+'" alt="'+esc(e.name)+'"></div>':'<div class="photo">'+esc(initials)+'</div>';
    var links=(e.links||[]).filter(function(l){return l.url}).map(function(l){
      return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'}).join('');
    app.innerHTML='<section class="card">'+photo+'<h1>'+esc(e.name)+'</h1><p class="role">'+esc(e.role)+'</p><p class="bio">'+esc(e.bio)+'</p><nav class="links">'+links+'</nav></section>';
  }
  fetch('employees.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
    render(d.employees);window.addEventListener('hashchange',function(){render(d.employees)})
  }).catch(function(){app.innerHTML='<p class="msg">Не удалось загрузить данные.</p>'});
})();
</script>
</body>
</html>
